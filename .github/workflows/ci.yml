name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: PHP – Syntax und composer.json
        run: |
          find php wordpress typo3 shopware gate -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          (cd php && composer validate --no-check-lock)
      - name: Node – Pakete bauen
        run: |
          (cd node && npm pack --dry-run)
          (cd react && npm pack --dry-run)
          node --check node/index.mjs
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - name: Go – prüfen
        run: (cd go && go vet ./...)
      - name: Python – Paket bauen
        run: |
          pip install build
          (cd python && python -m build)
